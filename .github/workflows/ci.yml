name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sidefleet
          POSTGRES_PASSWORD: sidefleet
          POSTGRES_DB: sidefleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sidefleet" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sidefleet:sidefleet@localhost:5432/sidefleet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - name: Pull request leaves web-dist alone
        if: github.event_name == 'pull_request'
        run: |
          # HEAD is the PR merged into its base, so HEAD^1 is the base.
          git diff --quiet HEAD^1 HEAD -- crates/server/web-dist || {
            echo "::error::Don't commit crates/server/web-dist; the web-dist workflow rebuilds it on main. Drop it with: git checkout \$(git merge-base origin/main HEAD) -- crates/server/web-dist && git commit"; exit 1; }
      - run: pnpm --dir web build
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
