name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin }
          - { os: macos-14,        target: x86_64-apple-darwin }
          - { os: ubuntu-24.04,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Build the web app from the tagged source rather than trust that main's web-dist
      # workflow already ran for this commit.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - run: cargo build --release --locked -p sidefleet --target ${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf sidefleet-${{ matrix.target }}.tar.gz sidefleet
      - uses: softprops/action-gh-release@v2
        with:
          files: sidefleet-${{ matrix.target }}.tar.gz
          generate_release_notes: true
